<!DOCTYPE html>
<html lang="ja">
<!--
  ============================================================
  【ひな形】公開中アプリのプライバシーポリシーページ
  配置先：docs/apps/<アプリのスラッグ>/privacy/index.html
  ※ 相対パスは配置先に置いた状態で正しくなります（templates/ のまま開くと CSS は効きません）。
  使い方：{{APP_NAME}} をアプリ名に一括置換し、[BODY] の中身を差し替えてください。
  ============================================================
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ▼ [FRAME] ページ情報：アプリ名だけ書き換え -->
  <title>{{APP_NAME}} プライバシーポリシー | mornie!</title>
  <meta name="description" content="アプリ「{{APP_NAME}}」のプライバシーポリシーです。">
  <!-- ▲ [FRAME] ページ情報 -->
  <link rel="icon" href="../../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へスキップ</a>

  <!-- ▼ [COMMON] 共通ヘッダー：全ページ同じ内容（変更時は全ページを修正） -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="../../../">mornie<span>!</span></a>
      <nav class="global-nav" aria-label="メインメニュー">
        <ul>
          <li><a href="../../../#apps">Apps</a></li>
          <li><a href="../../../#support">Support</a></li>
          <li><a href="../../../#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- ▲ [COMMON] 共通ヘッダー -->

  <main id="main">
    <!-- ▼ [FRAME] パンくず・ページ見出し：アプリ名だけ書き換え -->
    <div class="container">
      <ol class="breadcrumb">
        <li><a href="../../../">トップ</a></li>
        <li><a href="../">{{APP_NAME}} サポート</a></li>
        <li aria-current="page">プライバシーポリシー</li>
      </ol>
    </div>

    <section class="page-head">
      <div class="container">
        <div class="page-head__meta">
          <span>対象アプリ：{{APP_NAME}}</span>
        </div>
        <h1>{{APP_NAME}} プライバシーポリシー</h1>
      </div>
    </section>
    <!-- ▲ [FRAME] パンくず・ページ見出し -->

    <section class="page-section">
      <div class="container">
        <div class="panel policy">
          <!-- ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼
               [BODY] 本文エリア：各アプリのプロジェクトで差し替える部分
               - ポリシー本文（前文・各条項・お問い合わせ先・制定日/改定日）をここに書きます
               - 条項の見出しは <h2>、小見出しは <h3> を使ってください
               - 日付は末尾の <div class="policy-dates"> に書くと小さく表示されます
               ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼ -->
          <div class="body-placeholder">
            <p>ここに {{APP_NAME}} のプライバシーポリシー本文が入ります。</p>
          </div>

          <!-- 例：
          <p>mornie!（以下「運営者」といいます）は、……以下のとおりプライバシーポリシーを定めます。</p>
          <h2>1. 取り扱う情報</h2>
          <p>……</p>
          <h2>2. お問い合わせ先</h2>
          <p>運営者：mornie!<br>メールアドレス：<a href="mailto:mornie.official@gmail.com">mornie.official@gmail.com</a></p>
          <div class="policy-dates">
            <p>制定日：YYYY年M月D日</p>
            <p>最終改定日：YYYY年M月D日</p>
          </div>
          -->
          <!-- ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
               [BODY] 本文エリアここまで
               ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ -->
        </div>

        <!-- ▼ [FRAME] 戻るリンク（基本的に変更不要） -->
        <div class="btn-row btn-row--spaced">
          <a class="btn btn--ghost" href="../">{{APP_NAME}} サポートへ戻る</a>
          <a class="btn btn--ghost" href="../../../">トップへ戻る</a>
        </div>
        <!-- ▲ [FRAME] 戻るリンク -->
      </div>
    </section>
  </main>

  <!-- ▼ [COMMON] 共通フッター：全ページ同じ内容（変更時は全ページを修正） -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="logo" href="../../../">mornie<span>!</span></a>
      <ul class="footer-nav">
        <li><a href="../../../">トップ</a></li>
        <li><a href="../../../#contact">お問い合わせ</a></li>
      </ul>
      <p class="copyright">&copy; mornie!</p>
    </div>
  </footer>
  <!-- ▲ [COMMON] 共通フッター -->
</body>
</html>
